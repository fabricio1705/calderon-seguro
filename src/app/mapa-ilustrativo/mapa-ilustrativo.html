<div class="mapa">
  <svg #svg [attr.viewBox]="viewBox()" preserveAspectRatio="xMidYMid slice" [class.marcable]="permitirMarcar()"
    (click)="alHacerClic($event)" role="img" aria-label="Mapa ilustrativo de Abdón Calderón y Portoviejo">
    <!-- Fondo y zonas verdes -->
    <rect x="0" y="0" width="800" height="520" fill="#eaf0e4" />
    <path d="M0 0 H270 C240 60 150 95 0 115 Z" fill="#d6e8cc" />
    <path d="M570 0 H800 V160 C720 130 640 95 570 0 Z" fill="#d6e8cc" />
    <path d="M610 390 C690 365 760 395 800 425 V520 H560 C560 465 575 410 610 390 Z" fill="#d6e8cc" />
    <path d="M0 455 C80 430 160 460 210 520 H0 Z" fill="#d6e8cc" />

    <!-- Parcelas agrícolas -->
    <g fill="#e0edd5" stroke="#d0e2c3" stroke-width="1">
      <rect x="250" y="40" width="90" height="60" rx="6" transform="rotate(-8 295 70)" />
      <rect x="610" y="220" width="110" height="70" rx="6" transform="rotate(6 665 255)" />
      <rect x="600" y="300" width="80" height="55" rx="6" />
      <rect x="230" y="380" width="100" height="70" rx="6" transform="rotate(-5 280 415)" />
      <rect x="560" y="430" width="70" height="50" rx="6" />
      <rect x="680" y="40" width="80" height="55" rx="6" transform="rotate(10 720 67)" />
    </g>

    <!-- Río Portoviejo -->
    <path id="rio" d="M-20 125 C 90 155, 170 105, 270 150 S 420 225, 520 198 S 690 245, 820 228" stroke="#a9d0ef"
      stroke-width="16" fill="none" stroke-linecap="round" />
    <text class="etiqueta-rio"><textPath href="#rio" startOffset="8%">Río Portoviejo</textPath></text>

    <!-- Zona urbana de Portoviejo (izquierda) -->
    <rect x="8" y="242" width="190" height="186" rx="22" fill="#f6f3ec" />
    @for (m of manzanasPortoviejo; track $index) {
      <rect [attr.x]="m.x" [attr.y]="m.y" [attr.width]="m.w" [attr.height]="m.h" rx="3" fill="#e7e0d2" />
    }

    <!-- Zona urbana de Abdón Calderón (centro) -->
    <rect x="340" y="166" width="240" height="262" rx="26" fill="#f6f3ec" />
    @for (m of manzanasCalderon; track $index) {
      <rect [attr.x]="m.x" [attr.y]="m.y" [attr.width]="m.w" [attr.height]="m.h" rx="4" fill="#ebe4d6" />
    }
    <rect x="460" y="322" width="30" height="26" rx="4" fill="#bfe0b0" />
    <text x="475" y="362" class="etiqueta-chica" text-anchor="middle">Parque</text>

    <!-- Vías secundarias -->
    <g stroke="#ffffff" stroke-width="5" fill="none" stroke-linecap="round">
      <path d="M330 300 C 300 380, 280 440, 260 540" />
      <path d="M560 280 C 600 340, 640 380, 700 420" />
      <path d="M100 240 C 120 180, 160 140, 200 -20" />
    </g>

    <!-- Vía norte – sur -->
    <path d="M452 -20 C 442 100, 432 200, 442 290 S 452 440, 482 540" stroke="#d5d9df" stroke-width="13" fill="none" />
    <path d="M452 -20 C 442 100, 432 200, 442 290 S 452 440, 482 540" stroke="#ffffff" stroke-width="9" fill="none" />

    <!-- Vía principal Portoviejo – Abdón Calderón -->
    <path id="via" d="M-20 340 C 120 330, 230 310, 330 300 S 560 280, 820 190" stroke="#d5d9df" stroke-width="17"
      fill="none" />
    <path d="M-20 340 C 120 330, 230 310, 330 300 S 560 280, 820 190" stroke="#ffffff" stroke-width="12" fill="none" />
    <path d="M-20 340 C 120 330, 230 310, 330 300 S 560 280, 820 190" stroke="#f6c453" stroke-width="1.5"
      stroke-dasharray="8 8" fill="none" />
    <text class="etiqueta-via"><textPath href="#via" startOffset="27%">Vía Portoviejo – Calderón</textPath></text>

    <!-- Nombres de lugares -->
    <text x="460" y="156" class="etiqueta-lugar" text-anchor="middle">ABDÓN CALDERÓN</text>
    <text x="103" y="232" class="etiqueta-ciudad" text-anchor="middle">PORTOVIEJO</text>

    <!-- Marcadores de ejemplo -->
    @for (m of marcadores(); track m.id) {
      <g class="marcador" [attr.transform]="transformarMarcador(m, m.id === seleccionado())"
        (click)="seleccionarMarcador($event, m.id)">
        <ellipse cx="0" cy="0" rx="7" ry="2.5" fill="rgba(0,0,0,0.2)" />
        <path d="M0 0 C-3 -8 -12 -13 -12 -22 A12 12 0 1 1 12 -22 C12 -13 3 -8 0 0 Z" [attr.fill]="m.color"
          stroke="#fff" stroke-width="2" />
        <circle cx="0" cy="-22" r="4.5" fill="#fff" />
      </g>
    }

    <!-- Punto de ubicación del incidente -->
    @if (punto(); as p) {
      <g [attr.transform]="transformarMarcador(p)">
        <circle cx="0" cy="0" r="16" class="pulso" />
        <ellipse cx="0" cy="0" rx="8" ry="3" fill="rgba(0,0,0,0.2)" />
        <path d="M0 0 C-4 -10 -15 -16 -15 -28 A15 15 0 1 1 15 -28 C15 -16 4 -10 0 0 Z" fill="#1d6cf2" stroke="#fff"
          stroke-width="2.5" />
        <circle cx="0" cy="-28" r="5.5" fill="#fff" />
      </g>
    }
  </svg>

  <!-- Controles visuales -->
  <div class="controles">
    <button type="button" aria-label="Acercar" [disabled]="nivel() === 3" (click)="acercar()">
      <app-icon name="plus" [size]="18" />
    </button>
    <button type="button" aria-label="Alejar" [disabled]="nivel() === 0" (click)="alejar()">
      <app-icon name="minus" [size]="18" />
    </button>
  </div>
  <button type="button" class="control-ubicar" aria-label="Mi ubicación" (click)="ubicar.emit()">
    <app-icon name="locate" [size]="18" />
  </button>

  <span class="nota-mapa">Mapa ilustrativo · sin precisión geográfica</span>
  <span class="norte">N</span>
</div>
